<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .quiz-info {
            color: #666;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 5px;
        }
        .timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            z-index: 1000;
        }
        .timer.warning {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .question-card {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .question-number {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        .media-container {
            margin: 20px 0;
            text-align: center;
        }
        .media-container img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 5px;
        }
        .media-container video, .media-container audio {
            max-width: 100%;
            border-radius: 5px;
        }
        .options {
            margin-top: 20px;
        }
        .option {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 2px solid #ddd;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .option.selected {
            border-color: #667eea;
            background: #e7f3ff;
        }
        .option input[type="checkbox"], .option input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .text-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            font-family: inherit;
        }
        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 30px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
        }
        .progress {
            background: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            background: #667eea;
            height: 100%;
            transition: width 0.3s;
        }
        .results {
            text-align: center;
        }
        .score {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
        }
        .result-message {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
        }
        .question-review {
            text-align: left;
            margin-top: 30px;
        }
        .review-item {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #ddd;
        }
        .review-item.correct {
            border-left-color: #28a745;
        }
        .review-item.incorrect {
            border-left-color: #dc3545;
        }
        .review-question {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .review-answer {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #fcc;
            margin-bottom: 20px;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="timer" id="timer" style="display: none;">
        ⏱️ <span id="timeRemaining">00:00</span>
    </div>

    <div class="container">
        <!-- Loading State -->
        <div id="loadingState" class="card loading">
            <h2>Loading quiz...</h2>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="card" style="display: none;">
            <h1 id="quizTitle"></h1>
            <div class="quiz-info">
                <p><strong>Time Limit:</strong> <span id="timeLimit"></span> minutes</p>
                <p><strong>Questions:</strong> <span id="questionCount"></span></p>
                <p id="quizDescription" style="margin-top: 10px;"></p>
            </div>

            <div class="form-group">
                <label>Enter your email to start:</label>
                <input type="email" id="userEmail" placeholder="your@email.com" required>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <button class="btn-primary" onclick="startQuiz()" style="width: 100%;">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="card" style="display: none;">
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div id="questionContainer"></div>

            <div class="navigation">
                <button class="btn-secondary" id="prevBtn" onclick="previousQuestion()" style="display: none;">← Previous</button>
                <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
                <button class="btn-success" id="submitBtn" onclick="submitQuiz()" style="display: none;">Submit Quiz</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="card" style="display: none;">
            <div class="results">
                <h1>Quiz Completed! 🎉</h1>
                <div class="score">
                    <span id="finalScore">0</span>/<span id="totalQuestions">0</span>
                </div>
                <div class="result-message">
                    You scored <strong id="percentage">0</strong>%
                </div>
            </div>

            <div class="question-review">
                <h3>Review Your Answers</h3>
                <div id="reviewContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let quiz = null;
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let startTime = null;
        let timerInterval = null;
        let userIdentifier = null;

        async function loadQuiz() {
            const token = window.location.pathname.split('/').pop();
            
            try {
                const response = await fetch(`${API_URL}/attempt/quiz/${token}`);
                const data = await response.json();

                if (response.ok) {
                    quiz = data.quiz;
                    userAnswers = new Array(quiz.questions.length).fill(null);
                    displayStartScreen();
                } else {
                    document.getElementById('loadingState').innerHTML = `
                        <h2 style="color: #dc3545;">Error</h2>
                        <p>${data.error}</p>
                    `;
                }
            } catch (error) {
                document.getElementById('loadingState').innerHTML = `
                    <h2 style="color: #dc3545;">Network Error</h2>
                    <p>Could not load quiz. Please check your connection.</p>
                `;
            }
        }

        function displayStartScreen() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('startScreen').style.display = 'block';
            
            document.getElementById('quizTitle').textContent = quiz.title;
            document.getElementById('timeLimit').textContent = quiz.timeLimit;
            document.getElementById('questionCount').textContent = quiz.questionCount;
            document.getElementById('quizDescription').textContent = quiz.description || '';
        }

        async function startQuiz() {
            const email = document.getElementById('userEmail').value.trim();
            
            if (!email) {
                showError('Please enter your email');
                return;
            }

            userIdentifier = email;

            // Check if already attempted
            try {
                const response = await fetch(`${API_URL}/attempt/quiz/${window.location.pathname.split('/').pop()}/check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userIdentifier })
                });

                const data = await response.json();

                if (data.hasAttempted) {
                    showError('You have already attempted this quiz. Only one attempt is allowed.');
                    return;
                }

                // Start quiz
                startTime = new Date().toISOString();
                document.getElementById('startScreen').style.display = 'none';
                document.getElementById('quizScreen').style.display = 'block';
                document.getElementById('timer').style.display = 'block';
                
                startTimer();
                displayQuestion();
            } catch (error) {
                showError('Network error. Please try again.');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function startTimer() {
            const endTime = new Date(startTime).getTime() + (quiz.timeLimit * 60 * 1000);
            
            timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const remaining = endTime - now;

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz(true);
                    return;
                }

                const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

                document.getElementById('timeRemaining').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                if (remaining < 60000) {
                    document.getElementById('timer').classList.add('warning');
                }
            }, 1000);
        }

        function displayQuestion() {
            const question = quiz.questions[currentQuestionIndex];
            const container = document.getElementById('questionContainer');

            let optionsHtml = '';

            if (question.questionType === 'text') {
                optionsHtml = `
                    <input type="text" class="text-input" id="textAnswer" 
                           placeholder="Type your answer here"
                           value="${userAnswers[currentQuestionIndex] || ''}"
                           onchange="saveTextAnswer(this.value)">
                `;
            } else {
                const inputType = question.questionType === 'mcq' ? 'radio' : 'checkbox';
                optionsHtml = question.options.map((option, index) => {
                    const isSelected = userAnswers[currentQuestionIndex]?.includes(option._id);
                    return `
                        <div class="option ${isSelected ? 'selected' : ''}" onclick="selectOption('${option._id}', '${question.questionType}')">
                            <input type="${inputType}" name="answer" value="${option._id}" 
                                   ${isSelected ? 'checked' : ''}
                                   onchange="selectOption('${option._id}', '${question.questionType}')">
                            <span>${option.text}</span>
                        </div>
                    `;
                }).join('');
            }

            let mediaHtml = '';
            if (question.mediaUrl) {
                if (question.mediaType === 'image') {
                    mediaHtml = `<div class="media-container"><img src="${question.mediaUrl}" alt="Question media"></div>`;
                } else if (question.mediaType === 'video') {
                    mediaHtml = `<div class="media-container"><video controls src="${question.mediaUrl}"></video></div>`;
                } else if (question.mediaType === 'audio') {
                    mediaHtml = `<div class="media-container"><audio controls src="${question.mediaUrl}"></audio></div>`;
                }
            }

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestionIndex + 1} of ${quiz.questions.length}</div>
                    <div class="question-text">${question.questionText}</div>
                    ${mediaHtml}
                    <div class="options">${optionsHtml}</div>
                </div>
            `;

            updateNavigation();
            updateProgress();
        }

        function selectOption(optionId, questionType) {
            if (questionType === 'mcq') {
                userAnswers[currentQuestionIndex] = [optionId];
            } else {
                if (!userAnswers[currentQuestionIndex]) {
                    userAnswers[currentQuestionIndex] = [];
                }
                
                const index = userAnswers[currentQuestionIndex].indexOf(optionId);
                if (index > -1) {
                    userAnswers[currentQuestionIndex].splice(index, 1);
                } else {
                    userAnswers[currentQuestionIndex].push(optionId);
                }
            }
            displayQuestion();
        }

        function saveTextAnswer(value) {
            userAnswers[currentQuestionIndex] = value;
        }

        function updateNavigation() {
            document.getElementById('prevBtn').style.display = currentQuestionIndex > 0 ? 'block' : 'none';
            document.getElementById('nextBtn').style.display = currentQuestionIndex < quiz.questions.length - 1 ? 'block' : 'none';
            document.getElementById('submitBtn').style.display = currentQuestionIndex === quiz.questions.length - 1 ? 'block' : 'none';
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / quiz.questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function nextQuestion() {
            if (currentQuestionIndex < quiz.questions.length - 1) {
                currentQuestionIndex++;
                displayQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        async function submitQuiz(autoSubmit = false) {
            if (!autoSubmit && !confirm('Are you sure you want to submit? You cannot change your answers after submission.')) {
                return;
            }

            clearInterval(timerInterval);

            const responses = quiz.questions.map((question, index) => {
                const response = {
                    questionId: question._id
                };

                if (question.questionType === 'text') {
                    response.textAnswer = userAnswers[index] || '';
                } else {
                    response.selectedOptions = userAnswers[index] || [];
                }

                return response;
            });

            try {
                const token = window.location.pathname.split('/').pop();
                const response = await fetch(`${API_URL}/attempt/quiz/${token}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userIdentifier,
                        responses,
                        startedAt: startTime
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    displayResults(data);
                } else {
                    alert(data.error || 'Error submitting quiz');
                }
            } catch (error) {
                alert('Network error. Please try again.');
            }
        }

        function displayResults(data) {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';
            document.getElementById('timer').style.display = 'none';

            document.getElementById('finalScore').textContent = data.score;
            document.getElementById('totalQuestions').textContent = data.totalQuestions;
            document.getElementById('percentage').textContent = data.percentage;

            const reviewContainer = document.getElementById('reviewContainer');
            reviewContainer.innerHTML = data.responses.map((response, index) => {
                const question = quiz.questions[index];
                return `
                    <div class="review-item ${response.isCorrect ? 'correct' : 'incorrect'}">
                        <div class="review-question">
                            ${index + 1}. ${question.questionText}
                            ${response.isCorrect ? '✅ Correct' : '❌ Incorrect'}
                        </div>
                        <div class="review-answer">
                            Your answer: ${getAnswerText(question, response)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getAnswerText(question, response) {
            if (question.questionType === 'text') {
                return response.textAnswer || '(No answer)';
            } else {
                const selectedOptions = question.options.filter(opt => 
                    response.selectedOptions.includes(opt._id)
                );
                return selectedOptions.map(opt => opt.text).join(', ') || '(No answer)';
            }
        }

        loadQuiz();
    </script>
</body>
</html>
