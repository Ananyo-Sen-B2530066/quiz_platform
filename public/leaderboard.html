<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .navbar {
            background: rgba(255,255,255,0.95);
            color: #667eea;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .navbar h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            border: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .quiz-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .quiz-meta {
            color: #666;
            font-size: 14px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .leaderboard-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .leaderboard-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .leaderboard-table thead th {
            background: #f8f9fa;
            padding: 18px 20px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .leaderboard-table tbody tr {
            transition: all 0.3s;
            border-bottom: 1px solid #f0f0f0;
        }
        .leaderboard-table tbody tr:hover {
            background: #f8f9ff;
            transform: scale(1.01);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }
        .leaderboard-table td {
            padding: 20px;
            color: #333;
        }
        .rank-cell {
            font-weight: bold;
            font-size: 18px;
            width: 80px;
            text-align: center;
        }
        .rank-1 { color: #FFD700; }
        .rank-2 { color: #C0C0C0; }
        .rank-3 { color: #CD7F32; }
        .medal {
            font-size: 24px;
            margin-right: 5px;
        }
        .user-cell {
            font-weight: 500;
            color: #667eea;
            min-width: 200px;
        }
        .score-cell {
            font-weight: bold;
            font-size: 18px;
            color: #28a745;
        }
        .percentage-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }
        .percentage-excellent {
            background: #d4edda;
            color: #155724;
        }
        .percentage-good {
            background: #d1ecf1;
            color: #0c5460;
        }
        .percentage-average {
            background: #fff3cd;
            color: #856404;
        }
        .percentage-poor {
            background: #f8d7da;
            color: #721c24;
        }
        .metric-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: #f0f0f0;
            border-radius: 12px;
            font-size: 12px;
            color: #666;
            margin: 2px;
        }
        .metric-badge.important {
            background: #fff3cd;
            color: #856404;
        }
        .metric-badge.penalty {
            background: #ffebee;
            color: #c62828;
        }
        .metric-badge.time {
            background: #e3f2fd;
            color: #1565c0;
        }
        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .action-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 20px;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #999;
        }
        .empty-state h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .tie-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #f57c00;
            background: #fff3e0;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }
        @media (max-width: 768px) {
            .leaderboard-table {
                font-size: 12px;
            }
            .leaderboard-table td, .leaderboard-table th {
                padding: 12px 10px;
            }
            .quiz-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏆 Quiz Leaderboard</h1>
        <button class="back-btn" onclick="history.back()">← Back</button>
    </div>

    <div class="container">
        <div id="loadingState" class="loading">
            <h2>Loading leaderboard...</h2>
        </div>

        <div id="contentArea" style="display: none;">
            <div class="header-card">
                <div class="quiz-title" id="quizTitle"></div>
                <div class="quiz-meta" id="quizMeta"></div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalAttempts">0</div>
                    <div class="stat-label">Total Attempts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgScore">0</div>
                    <div class="stat-label">Average Score</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgPercentage">0%</div>
                    <div class="stat-label">Avg Percentage</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="topScore">0</div>
                    <div class="stat-label">Top Score</div>
                </div>
            </div>

            <div class="leaderboard-card">
                <div class="leaderboard-header">
                    🏆 Top 10 Performers
                </div>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Participant</th>
                            <th>Score</th>
                            <th>Percentage</th>
                            <th>Metrics</th>
                            <th>Time</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        const token = localStorage.getItem('token');
        const quizId = window.location.pathname.split('/').pop();

        if (!token) {
            window.location.href = '/';
        }

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            return `${minutes}m ${seconds}s`;
        }

        function getPercentageClass(percentage) {
            if (percentage >= 80) return 'percentage-excellent';
            if (percentage >= 60) return 'percentage-good';
            if (percentage >= 40) return 'percentage-average';
            return 'percentage-poor';
        }

        function calculateRankingMetrics(attempt) {
            const importantCorrect = attempt.responses.filter(r => 
                r.isImportant && r.isCorrect
            ).length;

            const negativeMarks = attempt.responses.reduce((sum, r) => {
                return sum + (r.earnedPoints < 0 ? Math.abs(r.earnedPoints) : 0);
            }, 0);

            const timeTaken = new Date(attempt.submittedAt) - new Date(attempt.startedAt);

            return {
                importantCorrect,
                negativeMarks,
                timeTaken
            };
        }

        function rankAttempts(attempts) {
    return attempts
        .map(attempt => ({
            ...attempt,
            metrics: calculateRankingMetrics(attempt)
        }))
        .sort((a, b) => {
            // Rule 1: Higher score wins
            if (a.score !== b.score) return b.score - a.score;

            // Rule 2: More important questions correct
            if (a.metrics.importantCorrect !== b.metrics.importantCorrect) {
                return b.metrics.importantCorrect - a.metrics.importantCorrect;
            }

            // NEW Rule 3: Higher level questions correct
            const aHighLevelCorrect = a.responses.filter(r => 
                r.isCorrect && r.questionLevel >= 4
            ).length;
            const bHighLevelCorrect = b.responses.filter(r => 
                r.isCorrect && r.questionLevel >= 4
            ).length;
            if (aHighLevelCorrect !== bHighLevelCorrect) {
                return bHighLevelCorrect - aHighLevelCorrect;
            }

            // Rule 4: Fewer negative marks
            if (a.metrics.negativeMarks !== b.metrics.negativeMarks) {
                return a.metrics.negativeMarks - b.metrics.negativeMarks;
            }

            // Rule 5: Faster submission time
            return a.metrics.timeTaken - b.metrics.timeTaken;
        })
        .slice(0, 10);
}

        function detectTies(rankedAttempts) {
            return rankedAttempts.map((attempt, index) => {
                if (index === 0) return { ...attempt, tieInfo: null };

                const prev = rankedAttempts[index - 1];
                let tieReason = null;

                if (attempt.score === prev.score) {
                    if (attempt.metrics.importantCorrect !== prev.metrics.importantCorrect) {
                        tieReason = 'Important Qs';
                    } else if (attempt.metrics.negativeMarks !== prev.metrics.negativeMarks) {
                        tieReason = 'Penalties';
                    } else if (attempt.metrics.timeTaken !== prev.metrics.timeTaken) {
                        tieReason = 'Time';
                    }
                }

                return { ...attempt, tieInfo: tieReason };
            });
        }

        async function loadLeaderboard() {
            try {
                const response = await fetch(`${API_URL}/attempt/results/${quizId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load data');
                }

                displayLeaderboard(data);
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                document.getElementById('loadingState').innerHTML = `
                    <div class="empty-state">
                        <h3>Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function displayLeaderboard(data) {
            const { quiz, totalAttempts, averageScore, averagePercentage, attempts } = data;

            // Update header
            document.getElementById('quizTitle').textContent = quiz.title;
            document.getElementById('quizMeta').innerHTML = `
                <span>📝 ${quiz.questionCount} Questions</span>
                <span>⏱️ ${quiz.timeLimit} Minutes</span>
                <span>📅 Created ${new Date(quiz.createdAt).toLocaleDateString()}</span>
            `;

            // Update stats
            document.getElementById('totalAttempts').textContent = totalAttempts;
            document.getElementById('avgScore').textContent = averageScore;
            document.getElementById('avgPercentage').textContent = `${averagePercentage}%`;
            
            const topScore = attempts.length > 0 ? Math.max(...attempts.map(a => a.score)) : 0;
            document.getElementById('topScore').textContent = topScore;

            // Rank and display attempts
            if (attempts.length === 0) {
                document.getElementById('leaderboardBody').innerHTML = `
                    <tr><td colspan="7" style="text-align: center; padding: 40px; color: #999;">
                        No attempts yet. Be the first to take this quiz!
                    </td></tr>
                `;
            } else {
                const rankedAttempts = detectTies(rankAttempts(attempts));
                displayRankedAttempts(rankedAttempts);
            }

            // Show content
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('contentArea').style.display = 'block';
        }

        function displayRankedAttempts(rankedAttempts) {
            const tbody = document.getElementById('leaderboardBody');
            
            tbody.innerHTML = rankedAttempts.map((attempt, index) => {
                const rank = index + 1;
                let rankDisplay = rank;
                let rankClass = '';

                if (rank === 1) {
                    rankDisplay = '<span class="medal">🥇</span>' + rank;
                    rankClass = 'rank-1';
                } else if (rank === 2) {
                    rankDisplay = '<span class="medal">🥈</span>' + rank;
                    rankClass = 'rank-2';
                } else if (rank === 3) {
                    rankDisplay = '<span class="medal">🥉</span>' + rank;
                    rankClass = 'rank-3';
                }

                const percentage = parseFloat(attempt.percentage);
                const percentageClass = getPercentageClass(percentage);

                const tieIndicator = attempt.tieInfo 
                    ? `<span class="tie-indicator">🔗 Tie: ${attempt.tieInfo}</span>`
                    : '';

                return `
                    <tr>
                        <td class="rank-cell ${rankClass}">${rankDisplay}</td>
                        <td class="user-cell">
                            ${attempt.userIdentifier}
                            ${tieIndicator}
                        </td>
                        <td class="score-cell">${attempt.score} / ${attempt.maxScore}</td>
                        <td>
                            <span class="percentage-badge ${percentageClass}">
                                ${percentage}%
                            </span>
                        </td>
                        <td>
                            <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                                <span class="metric-badge important">
                                    ⭐ ${attempt.metrics.importantCorrect}
                                </span>
                                <span class="metric-badge penalty">
                                    ⚠️ -${attempt.metrics.negativeMarks}
                                </span>
                            </div>
                        </td>
                        <td>
                            <span class="metric-badge time">
                                ⏱️ ${formatTime(attempt.metrics.timeTaken)}
                            </span>
                        </td>
                        <td>
                            <button class="action-btn" onclick="viewAttempt('${attempt.id}')">
                                View Details
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function viewAttempt(attemptId) {
            window.location.href = `/view-attempt/${attemptId}`;
        }

        loadLeaderboard();
    </script>
</body>
</html>
